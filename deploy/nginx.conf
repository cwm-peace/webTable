# 放在 nginx 的 http {} 内；将 form.example.com、站点目录和证书路径改为实际值。
# 先为真实域名签发证书，再启用443块并运行 nginx -t。此文件不提供自签名或占位证书。
map $uri $webtable_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[^/]+$" "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name form.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name form.example.com;
    ssl_certificate /etc/letsencrypt/live/form.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/form.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/webtable/dist;
    index index.html;
    autoindex off;
    disable_symlinks on;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $webtable_cache_control;
    etag on;

    # 原生gzip动态压缩；有预生成.gz文件时优先使用。Vary由模块按协商自动设置。
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf application/wasm;
    # Nginx标准发行版不自带Brotli。安装并加载ngx_brotli后才取消以下注释：
    # brotli on;
    # brotli_static on;
    # brotli_types text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf application/wasm;

    # 仅静态读取，不提供上传、API、管理页或SPA任意路径回退。
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~* ^/(api|admin)(/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
